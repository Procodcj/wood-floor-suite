<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Estimator — Wood Floor Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="room-estimator.css">
</head>
<body>
  <div class="card">

    <div class="header">
      <a href="index.html" class="back-link">← Wood Floor Suite</a>
      <div class="header-label">Project · Rooms · Sections</div>
      <h1>Room <span>Estimator</span></h1>
    </div>

    <div class="body">

      <!-- Add Room -->
      <div class="field-group">
        <label for="roomName">Room Name</label>
        <div class="input-row">
          <input type="text" id="roomName" placeholder="e.g. Kitchen, Master Bedroom">
          <button type="button" class="add-btn" id="addRoomBtn">Add</button>
        </div>
      </div>

      <div id="roomList"></div>

      <!-- Waste Factor -->
      <div class="field-group" id="wasteGroup">
        <label for="customWaste">Waste Factor</label>
        <div class="waste-selector">
          <button type="button" class="waste-btn active" data-waste="0">0%</button>
          <button type="button" class="waste-btn" data-waste="5">5%</button>
          <button type="button" class="waste-btn" data-waste="10">10%</button>
          <button type="button" class="waste-btn" data-waste="15">15%</button>
          <div class="waste-custom-wrap">
            <input type="number" id="customWaste" placeholder="Custom" min="0" max="100" step="any" inputmode="decimal" aria-label="Custom waste percentage">
            <span class="waste-unit">%</span>
          </div>
        </div>
      </div>

      <div id="grandTotal"></div>

    </div>

    <div class="footer">Measurements in feet · Multiple sections per room supported</div>
  </div>

  <script src="room-estimator.js"></script>
</body>
</html>
